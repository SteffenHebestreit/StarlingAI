# ── End-to-end test environment (synthetic, local only) ─────────────────────
# Two small deterministic services the e2e evaluation suite (eval/e2e/) runs against:
#
#   e2e-mail  GreenMail: SMTP + IMAP + REST API, the mailbox of the synthetic eval account
#             (eval@e2e.test). A pure sink: it never relays anywhere, every message it accepts
#             stays in memory and is gone when the container stops.
#   e2e-site  nginx serving the fictional company site in eval/e2e/site/ (read-only), reachable
#             inside the stack as http://www.nordlicht-werkzeuge.test/.
#
# Behind the `e2e` profile, so `sai start` never starts them. Start, stop and inspect them ONLY
# with `pnpm e2e:env up|down|status` (scripts/e2e-env.mjs): it runs them in the stack's own
# compose project, next to the running stack, and also switches the matching config on and off
# (the eval mail account, the SSRF exemption for the site's host name). See eval/e2e/ENVIRONMENT.md.
#
# Overlay only: it is used together with docker-compose.yml, whose networks it joins —
# starlingai-internal, where the gateway, mail-service and browser reach them, and
# starlingai-public, a regular bridge network, for the host port mappings (starlingai-internal
# is internal-only).
# Host ports are bound to 127.0.0.1 only — these are test fixtures, never exposed.
services:
  e2e-mail:
    profiles: ["e2e"]
    image: greenmail/standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
    restart: "no"
    mem_limit: 512m
    environment:
      # Replaces the image default, which turns authentication off. With it on, a wrong
      # account password fails the way it would against a real server. The one predefined
      # user is the eval mailbox (login = address, see eval/e2e/env/mail-accounts.json5);
      # a mailbox for any other recipient is created when the first message reaches it.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.api
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=eval:e2e-test-mailbox@e2e.test
        -Dgreenmail.users.login=email
      JAVA_OPTS: -Djava.net.preferIPv4Stack=true -Xmx256m
    ports:
      - "127.0.0.1:18080:8080"   # GreenMail REST API (harness: inspect / purge / reset)
      - "127.0.0.1:13025:3025"   # SMTP (harness: deliver)
      - "127.0.0.1:13143:3143"   # IMAP
    networks:
      starlingai-internal:
        aliases: [e2e-mail]
      starlingai-public:
        aliases: [e2e-mail]
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp asks the API's readiness endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/service/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  e2e-site:
    profiles: ["e2e"]
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: "no"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./eval/e2e/site:/usr/share/nginx/html:ro
      - ./eval/e2e/env/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18081:80"
    networks:
      starlingai-internal:
        aliases: [www.nordlicht-werkzeuge.test]
      starlingai-public:
        aliases: [www.nordlicht-werkzeuge.test]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
