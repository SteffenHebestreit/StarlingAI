# Access-log format that records only the request METHOD and normalized PATH
# ($uri, which excludes the query string) instead of the full request line. The
# WebSocket handshake authenticates with a JWT passed as ?token=..., and the
# default `combined` format would write that token into the access log verbatim.
log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status '
                     '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Never log query strings — see the `sanitized` format above.
    access_log /var/log/nginx/access.log sanitized;

    # Use Docker's internal DNS so upstream hostnames are resolved at request time
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gateway_upstream http://gateway:8765;

    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # noVNC live-browser proxy. MUST come before `location /ws` (longest-prefix
    # wins anyway, but keep it explicit): the /ws block hardcodes the upstream
    # path to /ws, which would drop the /browser-vnc/:id segment. Here we forward
    # the full original URI so the gateway's upgrade dispatcher routes it to the
    # VNC bridge instead of the RPC channel.
    location /ws/browser-vnc {
        proxy_pass $gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass $gateway_upstream/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA routing
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()";
    add_header X-DNS-Prefetch-Control "off";
    # Content-Security-Policy. script-src is strict 'self' — the Vite build emits
    # only external hashed bundles (no inline scripts). style-src needs
    # 'unsafe-inline' for Vue scoped styles + Tailwind + the theme store's injected
    # <style>; the fonts.googleapis/fontshare origins cover the OPT-IN typefaces
    # (the default typeface is self-hosted, so a default session needs none of
    # them). img-src allows https: so chat/markdown can render remote images.
    # connect-src 'self' covers the same-origin REST + WebSocket (incl. the noVNC
    # bridge, all proxied through this origin). frame-src / media-src need blob: for
    # artifact previews (HTML/PDF rendered via URL.createObjectURL in an iframe) and
    # voice playback (new Audio(blob:) for TTS / <audio> blobs) — without them both
    # fall back to default-src 'self', which never matches blob:, so previews render
    # blank and voice never plays. Operators fronting a CROSS-ORIGIN gateway URL must
    # extend connect-src with that origin (REST + WS). Tighten per deployment as needed.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'";

    # Gzip
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}
