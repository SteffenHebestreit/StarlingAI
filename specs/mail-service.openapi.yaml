openapi: 3.1.0
info:
  title: StarlingAI Mail Service
  version: 0.7.0
  summary: IMAP/SMTP, CalDAV, and CardDAV facade used by the swarm's mail_agent.
  description: |
    Standalone HTTP service that owns per-account IMAP, SMTP, CalDAV, and
    CardDAV clients so the gateway never holds mail-server sockets directly.

    Authentication: when `SAI_MAIL_SERVICE_TOKEN` is set, every request must
    carry `Authorization: Bearer <token>`. When unset, the service runs open
    and should only be reachable inside the private Docker network.

    Request and response schemas are intentionally loose where the runtime
    Zod schemas in `packages/mail-service/src/` are authoritative.
servers:
  - url: http://localhost:5020
    description: Local default (PORT env var)
  - url: http://mail-service:5020
    description: Docker Compose internal network

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Health:
      type: object
      properties:
        ok: { type: boolean }
        accounts: { type: integer }
      required: [ok, accounts]
    Account:
      type: object
      properties:
        id: { type: string }
        address: { type: string, format: email }
        displayName: { type: string }
      required: [id, address]
    Mailbox:
      type: object
      properties:
        path: { type: string }
        name: { type: string }
        specialUse: { type: string }
        messageCount: { type: integer }
        unseenCount: { type: integer }
    MessageActionItem:
      type: object
      properties:
        accountId: { type: string }
        mailbox: { type: string }
        uid: { type: integer, minimum: 1 }
      required: [accountId, mailbox, uid]
    MessageSummary:
      type: object
      description: Sort-friendly row returned by /api/messages/search.
      properties:
        accountId: { type: string }
        mailbox: { type: string }
        uid: { type: integer }
        messageId: { type: string }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        date: { type: string, format: date-time }
        attachmentCount: { type: integer }
        categories: { type: array, items: { type: string } }
        note: { type: string }
        textPreview: { type: string, description: First 240 characters of the plain-text body. }
    MessageFull:
      type: object
      properties:
        accountId: { type: string }
        mailbox: { type: string }
        uid: { type: integer }
        messageId: { type: string }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        date: { type: string, format: date-time }
        textBody: { type: string }
        html: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer }
        categories: { type: array, items: { type: string } }
        note: { type: string }
    Draft:
      type: object
      properties:
        id: { type: string }
        accountId: { type: string }
        to: { type: array, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        textBody: { type: string }
        html: { type: string }
        replyTo:
          $ref: '#/components/schemas/MessageActionItem'
        status: { type: string, enum: [draft, sent] }
        updatedAt: { type: string, format: date-time }
    Calendar:
      type: object
      properties:
        url: { type: string }
        displayName: { type: string }
        color: { type: string }
        supportedComponents: { type: array, items: { type: string } }
    CalendarEvent:
      type: object
      properties:
        uid: { type: string }
        url: { type: string }
        etag: { type: string }
        calendarUrl: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        start: { type: string }
        end: { type: string }
        allDay: { type: boolean }
        status: { type: string }
        attendees: { type: array, items: { type: string } }
        rrule: { type: string }
    AddressBook:
      type: object
      properties:
        url: { type: string }
        displayName: { type: string }
    Contact:
      type: object
      properties:
        uid: { type: string }
        url: { type: string }
        etag: { type: string }
        addressBookUrl: { type: string }
        fullName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        emails: { type: array, items: { type: string } }
        phones: { type: array, items: { type: string } }
        organization: { type: string }
        title: { type: string }
        notes: { type: string }
        birthday: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }

  /api/accounts:
    get:
      summary: List configured accounts (no secrets)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Account' } } } }

  /api/accounts/{accountId}/mailboxes:
    get:
      summary: List IMAP folders for an account
      parameters: [ { name: accountId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Mailbox' } } } }

  /api/mailboxes:
    post:
      summary: Create an IMAP folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                path: { type: string }
              required: [accountId, path]
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Mailbox' } } }
    delete:
      summary: Delete an IMAP folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                path: { type: string }
              required: [accountId, path]
      responses: { '200': { description: Deleted } }

  /api/messages/search:
    post:
      summary: Search messages across one or more accounts and mailboxes
      description: |
        Searches the given accounts/mailboxes for messages matching `query`.
        When `accountIds` is omitted, every configured account is searched.
        When `mailboxes` is omitted, `INBOX` is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountIds: { type: array, items: { type: string } }
                mailboxes: { type: array, items: { type: string } }
                query: { type: string, default: "" }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } } } }

  /api/messages/read:
    post:
      summary: Fetch a single message with attachments and category metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                mailbox: { type: string }
                uid: { type: integer, minimum: 1 }
              required: [accountId, mailbox, uid]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageFull' } } }
        '404': { description: Message not found }

  /api/messages/move:
    post:
      summary: Bulk move messages to a destination mailbox
      description: |
        `items` can span multiple source mailboxes and accounts; they are
        grouped per-account before the move is issued. When
        `createDestination` is true, the destination folder is created on
        each touched account if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/MessageActionItem' }
                destinationMailbox: { type: string }
                createDestination: { type: boolean, default: false }
              required: [items, destinationMailbox]
      responses: { '200': { description: Moved } }

  /api/messages/delete:
    post:
      summary: Bulk delete messages (soft-delete to Trash by default)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/MessageActionItem' }
                permanent:
                  type: boolean
                  default: false
                  description: When true, bypass Trash and expunge immediately.
              required: [items]
      responses: { '200': { description: Deleted } }

  /api/messages/categorize:
    post:
      summary: Attach custom category metadata to messages
      description: |
        Category data is stored in the service's local data file, not in the
        IMAP flags — it persists across moves as long as the UID is stable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      accountId: { type: string }
                      mailbox: { type: string }
                      uid: { type: integer, minimum: 1 }
                      category: { type: string }
                      note: { type: string }
                    required: [accountId, mailbox, uid, category]
              required: [items]
      responses: { '200': { description: Tagged } }

  /api/drafts:
    post:
      summary: Create a new draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                to: { type: array, minItems: 1, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email }, default: [] }
                bcc: { type: array, items: { type: string, format: email }, default: [] }
                subject: { type: string }
                textBody: { type: string }
                html: { type: string }
                replyTo:
                  $ref: '#/components/schemas/MessageActionItem'
              required: [accountId, to, subject, textBody]
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }

  /api/drafts/{draftId}:
    get:
      summary: Fetch a draft
      parameters: [ { name: draftId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }
        '404': { description: Draft not found }
    patch:
      summary: Update fields on a draft
      description: Accepts any subset of the draft fields (except `accountId`, which is immutable).
      parameters: [ { name: draftId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }
        '404': { description: Draft not found }

  /api/drafts/{draftId}/send:
    post:
      summary: Send a draft via SMTP
      parameters: [ { name: draftId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Sent
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }
        '404': { description: Draft not found }
        '409': { description: Draft already sent }

  /api/calendar/{accountId}/calendars:
    get:
      summary: List CalDAV calendars for an account
      parameters: [ { name: accountId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Calendar' } } } }
        '422': { description: Account has no CalDAV configuration }

  /api/calendar/events/list:
    post:
      summary: List calendar events in a time range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                calendarUrl: { type: string }
                start: { type: string, description: ISO 8601 or RFC 5545 DTSTART. }
                end: { type: string }
              required: [accountId, calendarUrl, start, end]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } } } }
        '422': { description: Account has no CalDAV configuration }

  /api/calendar/events:
    post:
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                calendarUrl: { type: string }
                uid: { type: string }
                title: { type: string }
                start: { type: string }
                end: { type: string }
                allDay: { type: boolean }
                description: { type: string }
                location: { type: string }
                status: { type: string }
                attendees: { type: array, items: { type: string } }
                rrule: { type: string }
              required: [accountId, calendarUrl, title, start, end]
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { type: object, properties: { uid: { type: string } } } } }
        '422': { description: Account has no CalDAV configuration }
    put:
      summary: Update an existing event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                eventUrl: { type: string }
                etag: { type: string }
                uid: { type: string }
                title: { type: string }
                start: { type: string }
                end: { type: string }
                allDay: { type: boolean }
                description: { type: string }
                location: { type: string }
                status: { type: string }
                attendees: { type: array, items: { type: string } }
                rrule: { type: string }
              required: [accountId, eventUrl, etag, title, start, end]
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                eventUrl: { type: string }
                etag: { type: string }
              required: [accountId, eventUrl, etag]
      responses: { '200': { description: Deleted } }

  /api/contacts/{accountId}/addressbooks:
    get:
      summary: List CardDAV address books
      parameters: [ { name: accountId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AddressBook' } } } }
        '422': { description: Account has no CardDAV configuration }

  /api/contacts/list:
    post:
      summary: List / search contacts in an address book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                addressBookUrl: { type: string }
                query: { type: string, description: Optional free-text filter. }
              required: [accountId, addressBookUrl]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contact' } } } }
        '422': { description: Account has no CardDAV configuration }

  /api/contacts:
    post:
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                addressBookUrl: { type: string }
                uid: { type: string }
                fullName: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                emails: { type: array, items: { type: string } }
                phones: { type: array, items: { type: string } }
                organization: { type: string }
                title: { type: string }
                notes: { type: string }
                birthday: { type: string }
              required: [accountId, addressBookUrl, fullName]
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { type: object, properties: { uid: { type: string } } } } }
        '422': { description: Account has no CardDAV configuration }
    put:
      summary: Update a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                contactUrl: { type: string }
                etag: { type: string }
                uid: { type: string }
                fullName: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                emails: { type: array, items: { type: string } }
                phones: { type: array, items: { type: string } }
                organization: { type: string }
                title: { type: string }
                notes: { type: string }
                birthday: { type: string }
              required: [accountId, contactUrl, etag, fullName]
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string }
                contactUrl: { type: string }
                etag: { type: string }
              required: [accountId, contactUrl, etag]
      responses: { '200': { description: Deleted } }
