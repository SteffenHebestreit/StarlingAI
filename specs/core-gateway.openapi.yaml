  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Streaming chat turn (AG-UI Server-Sent Events)
      description: |
        Streams `RUN_STARTED`, `TOOL_CALL_STARTED`, `TOOL_CALL_ENDED`, `RUN_FINISHED`,
