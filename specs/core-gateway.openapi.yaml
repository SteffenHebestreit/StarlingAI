  /api/chat:
    post:
      tags: [Chat]
      summary: Synchronous chat turn — NOT IMPLEMENTED
      description: |
        Always returns `501`. A turn is inherently streaming (tool calls, delegation,
        progress), so there is no useful synchronous response shape. Use
        `POST /api/chat/stream` (AG-UI SSE) or the WebSocket RPC channel.
        The endpoint is retained so integrators hitting the obvious path get a
        pointer to the real entry points rather than a `404`.
      responses:
        '401':
          description: Missing or invalid bearer token
        '501':
          description: Not implemented — use `/api/chat/stream` or the WebSocket RPC channel
  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Streaming chat turn (AG-UI Server-Sent Events)
      description: |
        Streams `RUN_STARTED`, `TOOL_CALL_STARTED`, `TOOL_CALL_ENDED`, `RUN_FINISHED`,
        and `RUN_ERROR` events as SSE frames. The final event carries the full
        assistant message. Clients should send `Accept: text/event-stream`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } } }
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
