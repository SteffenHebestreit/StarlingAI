# e2e-site — serves the fictional company site in eval/e2e/site/ (mounted read-only).
# Reached inside the stack as http://www.nordlicht-werkzeuge.test/ and from the host as
# http://localhost:18081/. Every answer is deterministic: no caching, no dates, no randomness.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain text/css application/javascript application/json;
    server_tokens off;
    # Relative Location headers: a redirect then works under any host name and port
    # (www.nordlicht-werkzeuge.test inside the stack, localhost:18081 on the host).
    absolute_redirect off;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # The catalogue starts on page 1.
    location = /produkte {
        return 302 /produkte/seite-1.html;
    }
    location = /produkte/ {
        return 302 /produkte/seite-1.html;
    }

    # The slow page: the server itself needs several seconds to send it (about 300 bytes/s).
    location = /langsam.html {
        limit_rate_after 0;
        limit_rate 300;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
