name: starlingai

services:
  # ── Core gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: runtime
    image: starlingai/gateway:dev
    restart: unless-stopped
    ports:
      - "8765:8765"   # WebSocket + REST
    environment:
      - NODE_ENV=production
      - SAI_JWT_SECRET=${SAI_JWT_SECRET}
      - SAI_MASTER_KEY=${SAI_MASTER_KEY}
      - SAI_LMSTUDIO_URL=${SAI_LMSTUDIO_URL:-http://10.10.0.2:1234/v1}
      - SAI_LMSTUDIO_API_KEY=${SAI_LMSTUDIO_API_KEY:-lm-studio}
      - SAI_MULTIMODAL_STT_URL=${SAI_MULTIMODAL_STT_URL:-http://host.docker.internal:5002}
      - SAI_MULTIMODAL_TTS_URL=${SAI_MULTIMODAL_TTS_URL:-http://host.docker.internal:5004}
      - DATABASE_URL=postgresql://starlingai:${POSTGRES_PASSWORD}@postgres:5432/starlingai
      - REDIS_URL=redis://redis:6379
      - MEMGRAPH_URL=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-}
      - QUESTDB_URL=http://questdb:9000
      - SAI_AUDIT_LOG=/data/audit.jsonl
      - SAI_CRED_STORE=/data/credentials.enc
      - SAI_USER_MEMORY_PATH=/data
      - SAI_CONFIG_PATH=/config/starlingai.json
      - SAI_MUTABLE_CONFIG_PATH=/data/starlingai.runtime.json
      - N8N_PASSWORD=${N8N_PASSWORD:-}
      - N8N_KEY=${N8N_KEY:-}
      - N8N_USERNAME=${N8N_USERNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FREELANCEMAP_PASSWORD=${FREELANCEMAP_PASSWORD:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://search.k2o}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_PENTEST_SERVICE_URL=${SAI_PENTEST_SERVICE_URL:-http://kali-pentest:5010}
      - SAI_MAIL_SERVICE_URL=${SAI_MAIL_SERVICE_URL:-http://mail-service:5020}
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_URL=${SAI_COMPUTER_REMOTE_URL:-http://computer-remote:8890}
      - SAI_WORKSPACE_MOUNT_SOURCE=${SAI_WORKSPACE_MOUNT_SOURCE:-}
      - SAI_WORKSPACE_CONFIG_PATH=/workspace/workspace
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    volumes:
      - gc-data:/data
      - ./starlingai.json:/config/starlingai.json:ro
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock  # For sandbox + container agent execution (rw)
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access LM Studio on host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      questdb:
        condition: service_healthy
      fastapi-mcp-template:
        condition: service_healthy
      mail-service:
        condition: service_healthy
      computer-remote:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  computer-remote:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: computer-remote-runtime
    image: starlingai/computer-remote:dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_COMPUTER_REMOTE_HOST=0.0.0.0
      - SAI_COMPUTER_REMOTE_PORT=8890
      - SAI_COMPUTER_REMOTE_TOKEN=${SAI_COMPUTER_REMOTE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_LABEL=${SAI_COMPUTER_REMOTE_LABEL:-Remote access sidecar}
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8890/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: starlingai/web:dev
    restart: unless-stopped
    ports:
      - "3001:3000"   # Host 3001 → container 3000 (3000 already in use on host)
    networks:
      - starlingai-public
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── File-to-Markdown service ───────────────────────────────────────────────
  fastapi-mcp-template:
    build:
      context: .
      dockerfile: docker/fastapi-mcp-template/Dockerfile
    image: starlingai/fastapi-mcp-template:dev
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENABLED_TOOLS=file_converter
      # qwen3.6-35b-a3b is used as a text model through the provider.
      # Keep LLM-enhanced image conversion disabled unless a real vision-capable model is loaded.
      - FTMD_MARKITDOWN_ENABLE_LLM=false
      # Provider configuration for file conversion features that rely on text-only model access.
      - FTMD_OPENAI_BASE_URL=${FTMD_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - FTMD_OPENAI_API_KEY=${FTMD_OPENAI_API_KEY:-lm-studio}
      - FTMD_OPENAI_MODEL=${FTMD_OPENAI_MODEL:-qwen3.6-35b-a3b}
      - LOG_LEVEL=${FASTAPI_MCP_TEMPLATE_LOG_LEVEL:-INFO}
    networks:
      - starlingai-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mail-service:
    build:
      context: .
      dockerfile: docker/mail-service/Dockerfile
    image: starlingai/mail-service:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5020
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_MAIL_SERVICE_CONFIG_PATH=${SAI_MAIL_SERVICE_CONFIG_PATH:-/config/mail/accounts.json}
      - SAI_MAIL_SERVICE_DATA_PATH=/data/mail-service.json
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
    volumes:
      - gc-mail-data:/data
      - ./config/mail:/config/mail:ro
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 9.9.9.9
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Kali Linux pentest service ────────────────────────────────────────────
  # Active scanning tools require PENTEST_SCOPE to be set.
  # Example: PENTEST_SCOPE=192.168.1.0/24,10.0.0.5,target.example.com
  # Profile "pentest" — start with: docker compose --profile pentest up
  kali-pentest:
    build:
      context: .
      dockerfile: docker/kali-pentest/Dockerfile
    image: starlingai/kali-pentest:dev
    profiles:
      - pentest
    restart: unless-stopped
    environment:
      # Authorized scan targets — MUST be set before active tools will run.
      # Format: comma-separated IPs, CIDR ranges, or hostnames.
      - PENTEST_SCOPE=${PENTEST_SCOPE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    cap_add:
      - NET_RAW       # Required for nmap SYN/UDP scans and Metasploit raw sockets
      - NET_ADMIN     # Required for some network-level recon tools
    # Memory limit — prevents OOM from heavy scans (full nmap -p-, sqlmap, metasploit)
    # crashing the service mid-run. Increase if scans are being killed unexpectedly.
    mem_limit: 2g
    memswap_limit: 2g    # no swap — fail fast rather than swap-thrash
    oom_kill_disable: false
    networks:
      - starlingai-internal    # Receives requests from gateway
      - starlingai-pentest     # Outbound scanning network (reaches external targets)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Computer Desktop (VNC) ──────────────────────────────────────────────
  # Ephemeral XFCE desktop exposed over VNC for computer-use agents.
  # Profile "computer-desktop" — start with: --computer-desktop flag or
  #   docker compose --profile computer-desktop up
  computer-desktop:
    build:
      context: .
      dockerfile: docker/computer-desktop/Dockerfile
    image: starlingai/computer-desktop:dev
    profiles:
      - computer-desktop
    restart: unless-stopped
    ports:
      - "${VNC_HOST_PORT:-5901}:5901"
    environment:
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COLOR_DEPTH=${VNC_COLOR_DEPTH:-24}
      - VNC_PASSWORD=${VNC_PASSWORD:-starling}
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q 5901"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Test runner — run all core unit tests ─────────────────────────────────
  # Usage: docker compose --profile test run --rm test-runner
  test-runner:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: test
    image: starlingai/test-runner:dev
    profiles:
      - test
    environment:
      - SAI_CONFIG_PATH=/app/starlingai.json
      - NODE_ENV=test
    networks:
      - starlingai-internal

  # ── Agent worker (ephemeral — built here, spawned by gateway on demand) ──
  # Not started by compose; gateway spawns individual containers via Docker socket.
  agent-worker:
    build:
      context: .
      dockerfile: docker/agent-worker/Dockerfile
    image: starlingai/agent-worker:dev
    profiles:
      - build-only   # Never started by `docker compose up`

  # ── PostgreSQL (audit logs) ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=starlingai
      - POSTGRES_USER=starlingai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - gc-postgres-data:/var/lib/postgresql/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlingai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis (sessions + rate limiting) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - gc-redis-data:/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Setup & tutorials server ──────────────────────────────────────────────
  tutorials:
    build:
      context: ./tutorials
      dockerfile: Dockerfile
    image: starlingai/tutorials:dev
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - starlingai-public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MemGraph (graph database — agent memory, entity relationships, knowledge graphs) ──
  memgraph:
    image: memgraph/memgraph-mage
    restart: unless-stopped
    command: >-
      --log-level=WARNING
      --storage-wal-enabled=true
      --storage-snapshot-on-exit=true
      --storage-snapshot-interval-sec=300
      --storage-snapshot-retention-count=3
      --query-execution-timeout-sec=120
      --bolt-num-workers=4
    volumes:
      - gc-memgraph-data:/var/lib/memgraph
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 --use-ssl=false --output-format=csv 2>/dev/null | grep -c '1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── QuestDB (time-series — agent metrics, event timelines, research logs) ──
  questdb:
    image: questdb/questdb:8.2.1
    restart: unless-stopped
    environment:
      - QDB_PG_ENABLED=false   # disable Postgres wire (HTTP API only)
      - QDB_HTTP_BIND_TO=0.0.0.0:9000
      - QDB_LOG_W_STDOUT_LEVEL=ERROR
    volumes:
      - gc-questdb-data:/var/lib/questdb
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': >/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gc-postgres-data:
  gc-redis-data:
  gc-memgraph-data:
  gc-questdb-data:
  gc-data:
  gc-mail-data:
  gc-workspace:
  gc-qwen-model-cache:

networks:
  starlingai-internal:
    driver: bridge
    internal: true   # No external internet access for backend services
  starlingai-public:
    driver: bridge
  starlingai-pentest:
    driver: bridge    # External internet access allowed for active scanning
