name: starlingai

services:
  # ── Core gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: runtime
    image: starlingai/gateway:dev
    restart: unless-stopped
    # Cap RSS so a runaway agent loop / large attachment / leak can't OOM the
    # whole host. Tune via SAI_GATEWAY_MEM_LIMIT (default 4g) if scenes touching
    # big payloads start getting killed (look for exit 137 in `docker logs
    # gateway`).
    mem_limit: ${SAI_GATEWAY_MEM_LIMIT:-4g}
    memswap_limit: ${SAI_GATEWAY_MEM_LIMIT:-4g}
    ports:
      - "8765:8765"   # WebSocket + REST
    # Load the full .env so every `$VAR` referenced by config (sites, channels,
    # scene/job webhook keys, credential refs) resolves at runtime. Without this
    # the gateway only sees the hand-listed `environment:` vars below, so any new
    # `$VAR` in config silently resolves to empty (e.g. site "not found"). The
    # explicit `environment:` entries still win over env_file for computed/infra
    # values. Mirrors the mail-service, which already does this.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SAI_JWT_SECRET=${SAI_JWT_SECRET}
      - SAI_MASTER_KEY=${SAI_MASTER_KEY}
      - SAI_LMSTUDIO_URL=${SAI_LMSTUDIO_URL:-http://10.10.0.2:1234/v1}
      - SAI_LMSTUDIO_API_KEY=${SAI_LMSTUDIO_API_KEY:-lm-studio}
      - SAI_MULTIMODAL_STT_URL=${SAI_MULTIMODAL_STT_URL:-http://host.docker.internal:5002}
      - SAI_MULTIMODAL_TTS_URL=${SAI_MULTIMODAL_TTS_URL:-http://host.docker.internal:5004}
      - DATABASE_URL=postgresql://starlingai:${POSTGRES_PASSWORD}@postgres:5432/starlingai
      - REDIS_URL=redis://redis:6379
      - MEMGRAPH_URL=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-}
      - QUESTDB_URL=http://questdb:9000
      - SAI_AUDIT_LOG=/data/audit.jsonl
      - SAI_CRED_STORE=/data/credentials.enc
      - SAI_USER_MEMORY_PATH=/data
      - SAI_CONFIG_PATH=/config/starlingai.json
      - SAI_MUTABLE_CONFIG_PATH=/data/starlingai.runtime.json
      - N8N_PASSWORD=${N8N_PASSWORD:-}
      - N8N_KEY=${N8N_KEY:-}
      - N8N_USERNAME=${N8N_USERNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FREELANCEMAP_PASSWORD=${FREELANCEMAP_PASSWORD:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://search.k2o}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_PENTEST_SERVICE_URL=${SAI_PENTEST_SERVICE_URL:-http://kali-pentest:5010}
      - SAI_MAIL_SERVICE_URL=${SAI_MAIL_SERVICE_URL:-http://mail-service:5020}
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_URL=${SAI_COMPUTER_REMOTE_URL:-http://computer-remote:8890}
      - SAI_WORKSPACE_MOUNT_SOURCE=${SAI_WORKSPACE_MOUNT_SOURCE:-}
      - SAI_WORKSPACE_CONFIG_PATH=/workspace/workspace
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    volumes:
      - gc-data:/data
      - ./starlingai.json:/config/starlingai.json:ro
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock  # For sandbox + container agent execution (rw)
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access LM Studio on host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      questdb:
        condition: service_healthy
      fastapi-mcp-template:
        condition: service_healthy
      mail-service:
        condition: service_healthy
      computer-remote:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  computer-remote:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: computer-remote-runtime
    image: starlingai/computer-remote:dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_COMPUTER_REMOTE_HOST=0.0.0.0
      - SAI_COMPUTER_REMOTE_PORT=8890
      - SAI_COMPUTER_REMOTE_TOKEN=${SAI_COMPUTER_REMOTE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_LABEL=${SAI_COMPUTER_REMOTE_LABEL:-Remote access sidecar}
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8890/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: starlingai/web:dev
    restart: unless-stopped
    # nginx + static SPA; 256m is generous. Cap prevents a runaway proxy buffer
    # from competing with the gateway for host memory. Tune via SAI_WEB_MEM_LIMIT.
    mem_limit: ${SAI_WEB_MEM_LIMIT:-256m}
    memswap_limit: ${SAI_WEB_MEM_LIMIT:-256m}
    ports:
      - "3001:3000"   # Host 3001 → container 3000 (3000 already in use on host)
    networks:
      - starlingai-public
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── File-to-Markdown service ───────────────────────────────────────────────
  fastapi-mcp-template:
    build:
      context: .
      dockerfile: docker/fastapi-mcp-template/Dockerfile
    image: starlingai/fastapi-mcp-template:dev
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENABLED_TOOLS=file_converter
      # qwen/qwen3.6-35b-a3b is used as a text model through the provider.
      # Keep LLM-enhanced image conversion disabled unless a real vision-capable model is loaded.
      - FTMD_MARKITDOWN_ENABLE_LLM=false
      # Provider configuration for file conversion features that rely on text-only model access.
      - FTMD_OPENAI_BASE_URL=${FTMD_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - FTMD_OPENAI_API_KEY=${FTMD_OPENAI_API_KEY:-lm-studio}
      # Bare LM Studio model id (no provider prefix — this hits LM Studio's API directly).
      - FTMD_OPENAI_MODEL=${FTMD_OPENAI_MODEL:-qwen/qwen3.6-35b-a3b}
      - LOG_LEVEL=${FASTAPI_MCP_TEMPLATE_LOG_LEVEL:-INFO}
    networks:
      - starlingai-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Document RAG: engram graph-RAG + its Neo4j (GDS) + a TEI reranker ───────
  # Attached/uploaded files are extracted to Markdown by fastapi-mcp-template,
  # then ingested into engram; the gateway retrieves relevant chunks per turn.
  # engram is OPTIONAL — the gateway degrades gracefully when it is absent — so
  # nothing depends_on it. Embeddings/LLM point at LM Studio (loaded models);
  # cross-encoder reranking is served by the `reranker` (TEI) sidecar, which is
  # also what the gateway's retrieval.reranker uses.
  engram:
    build:
      context: .
      dockerfile: docker/engram/Dockerfile
    image: starlingai/engram:dev
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://engram-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${ENGRAM_NEO4J_PASSWORD:-engram}
      # Embeddings + extraction LLM run on LM Studio (loaded models). engram is on
      # the public bridge so it can reach the LM Studio endpoint. The default
      # MUST match the gateway's (SAI_LMSTUDIO_URL default = 10.10.0.2) — that is
      # the instance with the models loaded; host.docker.internal points at a
      # different, empty LM Studio.
      - EMBEDDING_API_BASE=${SAI_LMSTUDIO_URL:-http://10.10.0.2:1234/v1}
      - EMBEDDING_API_KEY=${SAI_LMSTUDIO_API_KEY:-lm-studio}
      - EMBEDDING_MODEL=${ENGRAM_EMBEDDING_MODEL:-text-embedding-bge-m3}
      - EMBEDDING_DIM=${ENGRAM_EMBEDDING_DIM:-1024}
      - LLM_API_BASE=${SAI_LMSTUDIO_URL:-http://10.10.0.2:1234/v1}
      - LLM_API_KEY=${SAI_LMSTUDIO_API_KEY:-lm-studio}
      - LLM_MODEL=${ENGRAM_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      # This LM Studio build rejects response_format={"type":"json_object"} (it only
      # accepts json_schema/text), so disable JSON mode — engram still parses the
      # JSON object out of the plain text reply.
      - LLM_JSON_MODE=${ENGRAM_LLM_JSON_MODE:-false}
      # Cross-encoder reranker (TEI) — the same bge-reranker-v2-m3 the gateway uses.
      - RERANKER_API_BASE=http://reranker:80
      - RERANKER_API_KEY=
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_FORMAT=tei
      # Rerank shortlist size. Cheap on the GPU reranker, so use engram's default
      # (15) for good recall. Lower it (e.g. 6) only if the reranker runs on CPU.
      - RERANK_TOP_K=${ENGRAM_RERANK_TOP_K:-15}
      # Adopt (don't refuse) when the embedding model/dim differs from prior indexes.
      - SCHEMA_GUARD_MODE=${ENGRAM_SCHEMA_GUARD_MODE:-warn}
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      engram-neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  engram-neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${ENGRAM_NEO4J_PASSWORD:-engram}
      # Allow engram's documented default password ("engram", 6 chars). Neo4j 5.26
      # otherwise enforces an 8-char minimum and refuses to start.
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_server_memory_heap_initial__size=${ENGRAM_NEO4J_HEAP:-1G}
      - NEO4J_server_memory_heap_max__size=${ENGRAM_NEO4J_HEAP_MAX:-2G}
      - NEO4J_server_memory_pagecache_size=${ENGRAM_NEO4J_PAGECACHE:-1G}
      # Graph Data Science (community) backs engram's personalized-PageRank
      # graph proximity. Downloaded on first start (needs the public network).
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - gc-engram-neo4j-data:/data
      - gc-engram-neo4j-logs:/logs
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Cross-encoder reranker (HuggingFace text-embeddings-inference) — serves
  # bge-reranker-v2-m3 over the TEI `/rerank` contract. This is the proper way to
  # use a cross-encoder (LM Studio exposes the model only via /embeddings, and has
  # no rerank endpoint). Runs on the host GPU (RTX 4080, Ada/sm_89 → the `89-*`
  # TEI image): a cross-encoder rerank of long chunks is ~10× faster on GPU than
  # CPU (~0.2s vs ~10s). Used by BOTH the gateway (retrieval.reranker, mode "tei")
  # and engram. Pulls the model from HuggingFace on first start (public network +
  # cache volume). For a host without a Docker-visible GPU, override RERANKER_IMAGE
  # to ...:cpu-1.6 and drop the deploy.resources block.
  reranker:
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:89-1.6}
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}", "--port", "80"]
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
    volumes:
      - gc-reranker-cache:/data
    networks:
      - starlingai-internal
      - starlingai-public
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  mail-service:
    build:
      context: .
      dockerfile: docker/mail-service/Dockerfile
    image: starlingai/mail-service:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5020
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_MAIL_SERVICE_CONFIG_PATH=${SAI_MAIL_SERVICE_CONFIG_PATH:-/config/mail/accounts.json}
      - SAI_MAIL_SERVICE_DATA_PATH=/data/mail-service.json
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
    volumes:
      - gc-mail-data:/data
      - ./config/mail:/config/mail:ro
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 9.9.9.9
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Kali Linux pentest service ────────────────────────────────────────────
  # Active scanning tools require PENTEST_SCOPE to be set.
  # Example: PENTEST_SCOPE=192.168.1.0/24,10.0.0.5,target.example.com
  # Profile "pentest" — start with: docker compose --profile pentest up
  kali-pentest:
    build:
      context: .
      dockerfile: docker/kali-pentest/Dockerfile
    image: starlingai/kali-pentest:dev
    profiles:
      - pentest
    restart: unless-stopped
    environment:
      # Authorized scan targets — MUST be set before active tools will run.
      # Format: comma-separated IPs, CIDR ranges, or hostnames.
      - PENTEST_SCOPE=${PENTEST_SCOPE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    cap_add:
      - NET_RAW       # Required for nmap SYN/UDP scans and Metasploit raw sockets
      - NET_ADMIN     # Required for some network-level recon tools
    # Memory limit — prevents OOM from heavy scans (full nmap -p-, sqlmap, metasploit)
    # crashing the service mid-run. Increase if scans are being killed unexpectedly.
    mem_limit: 2g
    memswap_limit: 2g    # no swap — fail fast rather than swap-thrash
    oom_kill_disable: false
    networks:
      - starlingai-internal    # Receives requests from gateway
      - starlingai-pentest     # Outbound scanning network (reaches external targets)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Computer Desktop (VNC) ──────────────────────────────────────────────
  # Ephemeral XFCE desktop exposed over VNC for computer-use agents.
  # Profile "computer-desktop" — start with: --computer-desktop flag or
  #   docker compose --profile computer-desktop up
  computer-desktop:
    build:
      context: .
      dockerfile: docker/computer-desktop/Dockerfile
    image: starlingai/computer-desktop:dev
    profiles:
      - computer-desktop
    restart: unless-stopped
    ports:
      - "${VNC_HOST_PORT:-5901}:5901"
    environment:
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COLOR_DEPTH=${VNC_COLOR_DEPTH:-24}
      - VNC_PASSWORD=${VNC_PASSWORD:-starling}
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q 5901"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Browser-VNC (headed browser for human-in-the-loop handoff) ─────────────
  # Headed Chrome on a viewable VNC display + noVNC web client. This is the
  # browser the swarm drives (Playwright MCP connects to its CDP on :9222) AND
  # the one the operator can take over via the dashboard to solve a reCAPTCHA
  # mid-run, after which browser_agent continues on the same page.
  #
  # SECURITY — DO NOT PUBLISH PORTS 6080 OR 9222 TO THE HOST. x11vnc inside this
  # container runs with `-nopw` (no VNC password) because the only path that's
  # supposed to reach it goes through the gateway's `/ws/browser-vnc/:id` proxy,
  # which enforces JWT auth. Publishing 6080:6080 would expose an
  # unauthenticated VNC server to anything that can reach the host. CDP on
  # 9222 has no auth either — also keep it docker-internal. If you need local
  # debugging access, tunnel through the gateway instead.
  #
  # Two networks: starlingai-internal so the gateway can proxy noVNC, and
  # starlingai-public so the headed Chrome can actually load external sites
  # (internal is internet-isolated).
  browser-vnc:
    build:
      context: .
      dockerfile: docker/browser-vnc/Dockerfile
    image: starlingai/browser-vnc:dev
    restart: unless-stopped
    environment:
      - SCREEN_GEOMETRY=${BROWSER_SCREEN_GEOMETRY:-1600x900x24}
      - VNC_PASSWORD=${VNC_PASSWORD:-starling}
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q 6080 && ss -tlnp | grep -q 9222"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Test runner — run all core unit tests ─────────────────────────────────
  # Usage: docker compose --profile test run --rm test-runner
  test-runner:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: test
    image: starlingai/test-runner:dev
    profiles:
      - test
    environment:
      - SAI_CONFIG_PATH=/app/starlingai.json
      - NODE_ENV=test
    networks:
      - starlingai-internal

  # ── Agent worker (ephemeral — built here, spawned by gateway on demand) ──
  # Not started by compose; gateway spawns individual containers via Docker socket.
  agent-worker:
    build:
      context: .
      dockerfile: docker/agent-worker/Dockerfile
    image: starlingai/agent-worker:dev
    profiles:
      - build-only   # Never started by `docker compose up`

  # ── PostgreSQL (audit logs) ───────────────────────────────────────────────
  postgres:
    # pgvector image = stock PostgreSQL 16 + the `vector` extension (drop-in;
    # same PGDATA layout, so the existing volume upgrades in place). Backs the
    # unified semantic/RAG vector store (db/vector-store.ts).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=starlingai
      - POSTGRES_USER=starlingai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - gc-postgres-data:/var/lib/postgresql/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlingai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis (sessions + rate limiting) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - gc-redis-data:/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Setup & tutorials server ──────────────────────────────────────────────
  tutorials:
    build:
      context: ./tutorials
      dockerfile: Dockerfile
    image: starlingai/tutorials:dev
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - starlingai-public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MemGraph (graph database — agent memory, entity relationships, knowledge graphs) ──
  memgraph:
    image: memgraph/memgraph-mage
    restart: unless-stopped
    command: >-
      --log-level=WARNING
      --storage-wal-enabled=true
      --storage-snapshot-on-exit=true
      --storage-snapshot-interval-sec=300
      --storage-snapshot-retention-count=3
      --query-execution-timeout-sec=120
      --bolt-num-workers=4
    volumes:
      - gc-memgraph-data:/var/lib/memgraph
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 --use-ssl=false --output-format=csv 2>/dev/null | grep -c '1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── QuestDB (time-series — agent metrics, event timelines, research logs) ──
  questdb:
    image: questdb/questdb:8.2.1
    restart: unless-stopped
    environment:
      - QDB_PG_ENABLED=false   # disable Postgres wire (HTTP API only)
      - QDB_HTTP_BIND_TO=0.0.0.0:9000
      - QDB_LOG_W_STDOUT_LEVEL=ERROR
    volumes:
      - gc-questdb-data:/var/lib/questdb
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': >/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gc-postgres-data:
  gc-redis-data:
  gc-memgraph-data:
  gc-questdb-data:
  gc-data:
  gc-mail-data:
  gc-workspace:
  gc-qwen-model-cache:
  gc-engram-neo4j-data:
  gc-engram-neo4j-logs:
  gc-reranker-cache:

networks:
  starlingai-internal:
    driver: bridge
    internal: true   # No external internet access for backend services
  starlingai-public:
    driver: bridge
  starlingai-pentest:
    driver: bridge    # External internet access allowed for active scanning
