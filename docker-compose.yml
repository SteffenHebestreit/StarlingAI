name: starlingai

services:
  # ── Core gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: runtime
    image: starlingai/gateway:dev
    restart: unless-stopped
    # Cap RSS so a runaway agent loop / large attachment / leak can't OOM the
    # whole host. Tune via SAI_GATEWAY_MEM_LIMIT (default 4g) if scenes touching
    # big payloads start getting killed (look for exit 137 in `docker logs
    # gateway`).
    mem_limit: ${SAI_GATEWAY_MEM_LIMIT:-4g}
    memswap_limit: ${SAI_GATEWAY_MEM_LIMIT:-4g}
    ports:
      - "8765:8765"   # WebSocket + REST
    # Load the full .env so every `$VAR` referenced by config (sites, channels,
    # scene/job webhook keys, credential refs) resolves at runtime. Without this
    # the gateway only sees the hand-listed `environment:` vars below, so any new
    # `$VAR` in config silently resolves to empty (e.g. site "not found"). The
    # explicit `environment:` entries still win over env_file for computed/infra
    # values. Mirrors the mail-service, which already does this.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SAI_JWT_SECRET=${SAI_JWT_SECRET}
      - SAI_MASTER_KEY=${SAI_MASTER_KEY}
      # Primary model provider — any OpenAI-compatible server (LM Studio, Ollama, vLLM,
      # llama.cpp, LocalAI, OpenRouter, …). Set SAI_PRIMARY_MODEL_URL/KEY in .env to point at
      # yours; SAI_LMSTUDIO_URL/API_KEY remain as back-compat aliases. The host.docker.internal
      # default only works when the model runs on THIS Docker host — for a remote/homelab box
      # set SAI_PRIMARY_MODEL_URL=http://<host>:<port>/v1.
      - SAI_PRIMARY_MODEL_URL=${SAI_PRIMARY_MODEL_URL:-${SAI_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}}
      - SAI_PRIMARY_MODEL_KEY=${SAI_PRIMARY_MODEL_KEY:-${SAI_LMSTUDIO_API_KEY:-lm-studio}}
      - SAI_LMSTUDIO_URL=${SAI_PRIMARY_MODEL_URL:-${SAI_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}}
      - SAI_LMSTUDIO_API_KEY=${SAI_PRIMARY_MODEL_KEY:-${SAI_LMSTUDIO_API_KEY:-lm-studio}}
      - SAI_MULTIMODAL_STT_URL=${SAI_MULTIMODAL_STT_URL:-http://host.docker.internal:5002}
      - SAI_MULTIMODAL_TTS_URL=${SAI_MULTIMODAL_TTS_URL:-http://host.docker.internal:5004}
      - DATABASE_URL=postgresql://starlingai:${POSTGRES_PASSWORD}@postgres:5432/starlingai
      - REDIS_URL=redis://redis:6379
      - MEMGRAPH_URL=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-}
      - QUESTDB_URL=http://questdb:9000
      # Credential store + audit log live on the HOST bind mount (./.starlingai,
      # reached via the .:/workspace mount below), NOT the gc-data named volume — so a
      # clean wipe (`sai start --fresh` / `sai stop --volumes` => `docker compose down
      # -v`, which only removes NAMED volumes) PRESERVES them, matching the "Preserved:
      # credentials ... audit log" promise in scripts/sai.mjs. This is why the connected
      # Claude subscription token (credentials.enc, key anthropic_oauth) used to vanish
      # on every clean-wipe rebuild: it sat in gc-data. SAI_MASTER_KEY/SAI_JWT_SECRET are
      # already host .env so they survive too. (A clean wipe still resets the runtime
      # overlay /data/starlingai.runtime.json, so re-select Local<->Claude — but no re-auth.)
      - SAI_AUDIT_LOG=/workspace/.starlingai/audit.jsonl
      - SAI_CRED_STORE=/workspace/.starlingai/credentials.enc
      - SAI_USER_MEMORY_PATH=/data
      - SAI_CONFIG_PATH=/config/starlingai.json
      - SAI_MUTABLE_CONFIG_PATH=/data/starlingai.runtime.json
      - N8N_PASSWORD=${N8N_PASSWORD:-}
      - N8N_KEY=${N8N_KEY:-}
      - N8N_USERNAME=${N8N_USERNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FREELANCEMAP_PASSWORD=${FREELANCEMAP_PASSWORD:-}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_PENTEST_SERVICE_URL=${SAI_PENTEST_SERVICE_URL:-http://kali-pentest:5010}
      - SAI_MAIL_SERVICE_URL=${SAI_MAIL_SERVICE_URL:-http://mail-service:5020}
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_URL=${SAI_COMPUTER_REMOTE_URL:-http://computer-remote:8890}
      - SAI_WORKSPACE_MOUNT_SOURCE=${SAI_WORKSPACE_MOUNT_SOURCE:-}
      - SAI_WORKSPACE_CONFIG_PATH=/workspace/workspace
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    volumes:
      - gc-data:/data
      - ./starlingai.json:/config/starlingai.json:ro
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock  # For sandbox + container agent execution (rw)
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access LM Studio on host
    # The gateway waits on its datastores (Postgres + Redis + the graph/telemetry
    # DBs it may touch early). The feature sidecars (file-convert, mail,
    # computer-remote) are reached over HTTP only at tool-call time, never at boot —
    # so they are NOT boot dependencies and were removed from this gate. That is
    # what kept first-run boot gated on ~7 sidecars all going healthy (mail pins
    # external DNS; computer-remote + fastapi-mcp have 20-30s start_periods); a flap
    # there no longer blocks the gateway. They still start in parallel and their
    # tools work once ready.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      questdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  computer-remote:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: computer-remote-runtime
    image: starlingai/computer-remote:dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_COMPUTER_REMOTE_HOST=0.0.0.0
      - SAI_COMPUTER_REMOTE_PORT=8890
      - SAI_COMPUTER_REMOTE_TOKEN=${SAI_COMPUTER_REMOTE_TOKEN:-}
      - SAI_COMPUTER_REMOTE_LABEL=${SAI_COMPUTER_REMOTE_LABEL:-Remote access sidecar}
      - SAI_N8N_SSH_PASSWORD=${SAI_N8N_SSH_PASSWORD}
      - SAI_WIN_WORKSTATION_RDP_CREDENTIALS=${SAI_WIN_WORKSTATION_RDP_CREDENTIALS}
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8890/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: starlingai/web:dev
    restart: unless-stopped
    # nginx + static SPA; 256m is generous. Cap prevents a runaway proxy buffer
    # from competing with the gateway for host memory. Tune via SAI_WEB_MEM_LIMIT.
    mem_limit: ${SAI_WEB_MEM_LIMIT:-256m}
    memswap_limit: ${SAI_WEB_MEM_LIMIT:-256m}
    ports:
      - "3001:3000"   # Host 3001 → container 3000 (3000 already in use on host)
    networks:
      - starlingai-public
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── File-to-Markdown service ───────────────────────────────────────────────
  fastapi-mcp-template:
    build:
      context: .
      dockerfile: docker/fastapi-mcp-template/Dockerfile
    image: starlingai/fastapi-mcp-template:dev
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENABLED_TOOLS=file_converter
      # qwen/qwen3.6-35b-a3b is used as a text model through the provider.
      # Keep LLM-enhanced image conversion disabled unless a real vision-capable model is loaded.
      - FTMD_MARKITDOWN_ENABLE_LLM=false
      # Provider configuration for file conversion features that rely on text-only model access.
      - FTMD_OPENAI_BASE_URL=${FTMD_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - FTMD_OPENAI_API_KEY=${FTMD_OPENAI_API_KEY:-lm-studio}
      # Bare LM Studio model id (no provider prefix — this hits LM Studio's API directly).
      - FTMD_OPENAI_MODEL=${FTMD_OPENAI_MODEL:-qwen/qwen3.6-35b-a3b}
      - LOG_LEVEL=${FASTAPI_MCP_TEMPLATE_LOG_LEVEL:-INFO}
    networks:
      - starlingai-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Document RAG: engram graph-RAG + its Neo4j (GDS) + a TEI reranker ───────
  # Attached/uploaded files are extracted to Markdown by fastapi-mcp-template,
  # then ingested into engram; the gateway retrieves relevant chunks per turn.
  # engram is OPTIONAL — the gateway degrades gracefully when it is absent — so
  # nothing depends_on it. Embeddings/LLM point at LM Studio (loaded models);
  # cross-encoder reranking is served by the `reranker` (TEI) sidecar, which is
  # also what the gateway's retrieval.reranker uses.
  engram:
    # Document-RAG backend — behind the `rag` profile (off by default) together with
    # the reranker. The gateway degrades gracefully when it is absent (no depends_on).
    profiles: ["rag"]
    build:
      context: .
      dockerfile: docker/engram/Dockerfile
      # Engram version to clone+build. THIS is the effective ref (it overrides the Dockerfile
      # ARG default). Override to bump (e.g. ENGRAM_REF=v0.6.0 in .env); changing the value
      # re-fetches (the git layer is otherwise cached). Pinned to a post-v0.5.0 main commit
      # that adds the separate fast extraction model + json_schema/reasoning-off controls.
      args:
        ENGRAM_REF: ${ENGRAM_REF:-d81a488295c2443a9de42b98d411634207c3dd3d}
    image: starlingai/engram:dev
    restart: unless-stopped
    environment:
      # Embedded engram-db backend — in-process vector + BM25 + native-adjacency graph,
      # no Neo4j server, fastest backend at every scale (f16 = lossless ranking, ½ memory).
      - STORE_BACKEND=${ENGRAM_STORE_BACKEND:-engramdb}
      - ENGRAMDB_QUANTIZATION=${ENGRAM_ENGRAMDB_QUANTIZATION:-f16}
      # Embeddings + extraction LLM run on the same primary model server as the gateway.
      # The default (host.docker.internal:1234) reaches a model server — LM Studio,
      # Ollama, llama.cpp, vLLM, OpenRouter — running on the Docker HOST. Override
      # SAI_PRIMARY_MODEL_URL in .env to point engram + the gateway at a model server on
      # another machine (e.g. a homelab box at http://10.10.0.x:1234/v1).
      # To embed on the local GPU sidecar instead (e.g. external provider flaky), set
      # ENGRAM_EMBEDDING_API_BASE=http://reranker:80/v1 and
      # RERANKER_EMBED_MODEL=Qwen/Qwen3-Embedding-0.6B in .env (see the reranker svc).
      - EMBEDDING_API_BASE=${ENGRAM_EMBEDDING_API_BASE:-${SAI_PRIMARY_MODEL_URL:-${SAI_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}}}
      - EMBEDDING_API_KEY=${SAI_PRIMARY_MODEL_KEY:-${SAI_LMSTUDIO_API_KEY:-lm-studio}}
      - EMBEDDING_MODEL=${ENGRAM_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      - EMBEDDING_DIM=${ENGRAM_EMBEDDING_DIM:-1024}
      # Qwen3-Embedding is instruction-tuned: prepend a task instruct to QUERIES only
      # (passages stay raw). Set before first ingest — the passage side is part of the
      # schema signature. (Double-quoted so the \n becomes a real newline.)
      - "QUERY_INSTRUCTION=Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
      - LLM_API_BASE=${SAI_PRIMARY_MODEL_URL:-${SAI_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}}
      - LLM_API_KEY=${SAI_PRIMARY_MODEL_KEY:-${SAI_LMSTUDIO_API_KEY:-lm-studio}}
      - LLM_MODEL=${ENGRAM_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      # This LM Studio build rejects response_format={"type":"json_object"} (it only
      # accepts json_schema/text), so disable JSON mode — engram still parses the
      # JSON object out of the plain text reply.
      - LLM_JSON_MODE=${ENGRAM_LLM_JSON_MODE:-false}
      # Per-chunk metadata extraction (the high-volume, low-difficulty LLM call) is split
      # OFF the strong LLM_MODEL onto a tiny fast model for "best quality + speed": the LLM
      # extractor keeps semantic keywords/summaries (better graph than statistical `yake`),
      # but runs them on qwen3-0.6b with json_schema constrained decoding — measured ~0.33s
      # warm vs ~6-8s on the 35B, valid JSON guaranteed, and the schema constraint suppresses
      # chain-of-thought (the only reasoning-off that this LM Studio honours; it rejects
      # json_object). HyDE/contextual/community still use the strong LLM_MODEL above. Short
      # chunks (< MIN_CHARS) skip the round trip and fall back to statistical yake.
      - METADATA_EXTRACTOR=${ENGRAM_METADATA_EXTRACTOR:-default}
      - EXTRACTION_LLM_MODEL=${ENGRAM_EXTRACTION_LLM_MODEL:-qwen3-0.6b}
      - EXTRACTION_RESPONSE_FORMAT=${ENGRAM_EXTRACTION_RESPONSE_FORMAT:-json_schema}
      - EXTRACTION_MAX_TOKENS=${ENGRAM_EXTRACTION_MAX_TOKENS:-96}
      - EXTRACTION_MIN_CHARS=${ENGRAM_EXTRACTION_MIN_CHARS:-200}
      # Qwen3-Reranker-0.6B via the shared `reranker` GPU service (the measured
      # +3.15/+3.84 nDCG@10 upgrade) — the same reranker the gateway uses.
      - RERANKER_API_BASE=http://reranker:80
      - RERANKER_API_KEY=
      - RERANKER_MODEL=${ENGRAM_RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      - RERANKER_FORMAT=tei
      # Rerank shortlist size. Cheap on the GPU reranker, so use engram's default
      # (15) for good recall. Lower it (e.g. 6) only if the reranker runs on CPU.
      - RERANK_TOP_K=${ENGRAM_RERANK_TOP_K:-15}
      # Adopt (don't refuse) when the embedding model/dim differs from prior indexes.
      - SCHEMA_GUARD_MODE=${ENGRAM_SCHEMA_GUARD_MODE:-warn}
      # PERSISTENCE. engram-db is in-memory; with no path it snapshots NOWHERE, so every
      # container restart/rebuild silently WIPES all uploaded documents (a user's CV /
      # workspace library). Point it at a pickle snapshot on the named volume below: it is
      # written on graceful shutdown and reloaded on start, so uploads survive restarts.
      - ENGRAMDB_PATH=${ENGRAM_ENGRAMDB_PATH:-/data/engramdb.pkl}
    volumes:
      - engram-data:/data
    networks:
      - starlingai-internal
      - starlingai-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Qwen3-Reranker-0.6B — a causal-LM reranker served via sentence-transformers
  # CrossEncoder in the TEI `/rerank` format (TEI's classifier endpoint can't serve a
  # causal-LM reranker, and LM Studio exposes no /rerank at all — only a binary yes/no
  # with no logprobs, so no continuous scores). Runs on the host GPU (RTX 4080, fp16,
  # ~1.4GB). Used by BOTH the gateway (retrieval.reranker, mode "tei", http://reranker:80)
  # and engram — the same +3.15/+3.84 nDCG@10 reranker for the whole stack. Serves on
  # port 80 so the gateway config is unchanged; pulls the model from HuggingFace on
  # first request (public network + cache volume).
  #
  # Behind the `rag` profile (OFF by default) so a plain `docker compose up` on a
  # GPU-less machine (any ordinary laptop, all Macs) never aborts on the nvidia
  # reservation. Enable the RAG stack (engram + reranker) with `sai start --rag`
  # (or `--profile rag`). The GPU reservation lives in docker-compose.gpu.yml,
  # auto-added by `sai start` when a GPU is detected; without it the reranker runs
  # on CPU (fine for the 0.6B on small shortlists — USE_FP16 is a no-op without CUDA).
  #
  # OPTIONAL embeddings: the same sidecar can also serve Qwen3-Embedding-0.6B on the
  # GPU at /v1/embeddings — handy if your external embedding provider (e.g. LM Studio)
  # is flaky or unavailable. It's OFF by default (engram embeds via LM Studio). To
  # enable: set RERANKER_EMBED_MODEL=Qwen/Qwen3-Embedding-0.6B AND point engram at it
  # with ENGRAM_EMBEDDING_API_BASE=http://reranker:80/v1 (both in .env). ~1.2GB extra
  # GPU; loads lazily on the first /v1/embeddings request.
  reranker:
    profiles: ["rag"]
    build:
      context: ./docker/reranker-qwen
    image: starlingai/qwen-reranker:dev
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "80", "--workers", "1"]
    environment:
      - MODEL_NAME=${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      # Empty = embeddings endpoint disabled (pure reranker). Set to spin up the
      # local GPU embedder as a fallback for an external embedding provider.
      - EMBED_MODEL_NAME=${RERANKER_EMBED_MODEL:-}
      - USE_FP16=true
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
    volumes:
      - gc-engram-reranker-cache:/root/.cache/huggingface
    networks:
      - starlingai-internal
      - starlingai-public
    # GPU reservation is in docker-compose.gpu.yml (auto-added by `sai start` when a
    # GPU is present). On CPU the reranker still works, just slower.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mail-service:
    build:
      context: .
      dockerfile: docker/mail-service/Dockerfile
    image: starlingai/mail-service:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5020
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SAI_MAIL_SERVICE_CONFIG_PATH=${SAI_MAIL_SERVICE_CONFIG_PATH:-/config/mail/accounts.json}
      - SAI_MAIL_SERVICE_DATA_PATH=/data/mail-service.json
      - SAI_MAIL_SERVICE_TOKEN=${SAI_MAIL_SERVICE_TOKEN:-}
    volumes:
      - gc-mail-data:/data
      - ./config/mail:/config/mail:ro
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 9.9.9.9
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Kali Linux pentest service ────────────────────────────────────────────
  # Active scanning tools require PENTEST_SCOPE to be set.
  # Example: PENTEST_SCOPE=192.168.1.0/24,10.0.0.5,target.example.com
  # Profile "pentest" — start with: docker compose --profile pentest up
  kali-pentest:
    build:
      context: .
      dockerfile: docker/kali-pentest/Dockerfile
    image: starlingai/kali-pentest:dev
    profiles:
      - pentest
    restart: unless-stopped
    environment:
      # Authorized scan targets — MUST be set before active tools will run.
      # Format: comma-separated IPs, CIDR ranges, or hostnames.
      - PENTEST_SCOPE=${PENTEST_SCOPE:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    cap_add:
      - NET_RAW       # Required for nmap SYN/UDP scans and Metasploit raw sockets
      - NET_ADMIN     # Required for some network-level recon tools
    # Memory limit — prevents OOM from heavy scans (full nmap -p-, sqlmap, metasploit)
    # crashing the service mid-run. Increase if scans are being killed unexpectedly.
    mem_limit: 2g
    memswap_limit: 2g    # no swap — fail fast rather than swap-thrash
    oom_kill_disable: false
    networks:
      - starlingai-internal    # Receives requests from gateway
      - starlingai-pentest     # Outbound scanning network (reaches external targets)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Computer Desktop (VNC) ──────────────────────────────────────────────
  # Ephemeral XFCE desktop exposed over VNC for computer-use agents.
  # Profile "computer-desktop" — start with: --computer-desktop flag or
  #   docker compose --profile computer-desktop up
  computer-desktop:
    build:
      context: .
      dockerfile: docker/computer-desktop/Dockerfile
    image: starlingai/computer-desktop:dev
    profiles:
      - computer-desktop
    restart: unless-stopped
    ports:
      - "${VNC_HOST_PORT:-5901}:5901"
    environment:
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNC_COLOR_DEPTH=${VNC_COLOR_DEPTH:-24}
      - VNC_PASSWORD=${VNC_PASSWORD:-starling}
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q 5901"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Browser-VNC (headed browser for human-in-the-loop handoff) ─────────────
  # Headed Chrome on a viewable VNC display + noVNC web client. This is the
  # browser the swarm drives (Playwright MCP connects to its CDP on :9222) AND
  # the one the operator can take over via the dashboard to solve a reCAPTCHA
  # mid-run, after which browser_agent continues on the same page.
  #
  # SECURITY — DO NOT PUBLISH PORTS 6080 OR 9222 TO THE HOST. x11vnc inside this
  # container runs with `-nopw` (no VNC password) because the only path that's
  # supposed to reach it goes through the gateway's `/ws/browser-vnc/:id` proxy,
  # which enforces JWT auth. Publishing 6080:6080 would expose an
  # unauthenticated VNC server to anything that can reach the host. CDP on
  # 9222 has no auth either — also keep it docker-internal. If you need local
  # debugging access, tunnel through the gateway instead.
  #
  # Two networks: starlingai-internal so the gateway can proxy noVNC, and
  # starlingai-public so the headed Chrome can actually load external sites
  # (internal is internet-isolated).
  browser-vnc:
    build:
      context: .
      dockerfile: docker/browser-vnc/Dockerfile
    image: starlingai/browser-vnc:dev
    restart: unless-stopped
    environment:
      - SCREEN_GEOMETRY=${BROWSER_SCREEN_GEOMETRY:-1600x900x24}
      - VNC_PASSWORD=${VNC_PASSWORD:-starling}
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q 6080 && ss -tlnp | grep -q 9222"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Test runner — run all core unit tests ─────────────────────────────────
  # Usage: docker compose --profile test run --rm test-runner
  test-runner:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      target: test
    image: starlingai/test-runner:dev
    profiles:
      - test
    environment:
      - SAI_CONFIG_PATH=/app/starlingai.json
      - NODE_ENV=test
    networks:
      - starlingai-internal

  # ── Agent worker (ephemeral — built here, spawned by gateway on demand) ──
  # Not started by compose; gateway spawns individual containers via Docker socket.
  agent-worker:
    build:
      context: .
      dockerfile: docker/agent-worker/Dockerfile
    image: starlingai/agent-worker:dev
    profiles:
      - build-only   # Never started by `docker compose up`

  # ── Shell/script sandbox (built here, launched on demand by the shell tools) ──
  # Not started by compose; shell_exec/script_run `docker run` this locked-down image
  # (--network=none --read-only --cap-drop=ALL) once per command via the Docker socket.
  # Tagged :latest to match the shell tool's default (SAI_SANDBOX_IMAGE). Without this
  # build the shell/git/test agents fail with "container error: unknown" (missing image).
  sandbox:
    build:
      context: ./docker/sandbox
    image: starlingai/sandbox:latest
    profiles:
      - build-only   # Never started by `docker compose up`; just built so the image exists

  # ── PostgreSQL (audit logs) ───────────────────────────────────────────────
  postgres:
    # pgvector image = stock PostgreSQL 16 + the `vector` extension (drop-in;
    # same PGDATA layout, so the existing volume upgrades in place). Backs the
    # unified semantic/RAG vector store (db/vector-store.ts).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=starlingai
      - POSTGRES_USER=starlingai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - gc-postgres-data:/var/lib/postgresql/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlingai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis (sessions + rate limiting) ─────────────────────────────────────
  # ── Web search (SearXNG) ──────────────────────────────────────────────────
  # Self-hosted metasearch backend for the web_search tool. Previously the stack
  # relied on an EXTERNAL instance (SEARXNG_BASE_URL=http://search.k2o); this makes
  # the stack self-contained. JSON format + GET method are enabled, and the bot
  # limiter disabled, in docker/searxng/settings.yml (the web_search client needs
  # all three). On starlingai-public so it can reach search engines on the internet
  # (starlingai-internal has no egress); on starlingai-internal so the gateway can
  # reach it at http://searxng:8080. To keep using an external instance instead,
  # set SEARXNG_BASE_URL in .env.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-starlingai-internal-searxng-key}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - starlingai-internal
      - starlingai-public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - gc-redis-data:/data
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Setup & tutorials server ──────────────────────────────────────────────
  tutorials:
    build:
      context: ./tutorials
      dockerfile: Dockerfile
    image: starlingai/tutorials:dev
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - starlingai-public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MemGraph (graph database — agent memory, entity relationships, knowledge graphs) ──
  memgraph:
    image: memgraph/memgraph-mage
    restart: unless-stopped
    command: >-
      --log-level=WARNING
      --storage-wal-enabled=true
      --storage-snapshot-on-exit=true
      --storage-snapshot-interval-sec=300
      --storage-snapshot-retention-count=3
      --query-execution-timeout-sec=120
      --bolt-num-workers=4
    volumes:
      - gc-memgraph-data:/var/lib/memgraph
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 --use-ssl=false --output-format=csv 2>/dev/null | grep -c '1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── QuestDB (time-series — agent metrics, event timelines, research logs) ──
  questdb:
    image: questdb/questdb:8.2.1
    restart: unless-stopped
    environment:
      - QDB_PG_ENABLED=false   # disable Postgres wire (HTTP API only)
      - QDB_HTTP_BIND_TO=0.0.0.0:9000
      - QDB_LOG_W_STDOUT_LEVEL=ERROR
    volumes:
      - gc-questdb-data:/var/lib/questdb
    networks:
      - starlingai-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': >/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gc-postgres-data:
  gc-redis-data:
  gc-memgraph-data:
  gc-questdb-data:
  gc-data:
  gc-mail-data:
  gc-workspace:
  gc-qwen-model-cache:
  gc-engram-reranker-cache:
  # engram-db snapshot — persists uploaded documents (CV/profile, workspace library)
  # across container restarts/rebuilds. Wiped only by `sai stop --volumes` / `--fresh`.
  engram-data:

networks:
  starlingai-internal:
    driver: bridge
    internal: true   # No external internet access for backend services
  starlingai-public:
    # Explicit name (no compose project-prefix) so serve_app, which launches app
    # containers via raw `docker run --network starlingai-public`, attaches to the
    # SAME network the gateway is on. Without this, compose creates
    # `<project>_starlingai-public` and serve_app fails with "network not found".
    name: starlingai-public
    driver: bridge
  starlingai-pentest:
    driver: bridge    # External internet access allowed for active scanning
